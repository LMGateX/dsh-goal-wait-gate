<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Goal 策略控制模型 · 研究用</title>
<style>body{font:16px/1.65 system-ui;margin:36px auto;max-width:1060px;padding:0 18px;color:#20272e}h1{font-size:27px}section{border:1px solid #d8dee5;padding:18px;margin:18px 0;border-radius:8px}button,select{font:inherit;padding:6px 10px;margin:5px;border:1px solid #ccd4dd;background:#fff;border-radius:5px;cursor:pointer}button[aria-selected=true]{border-color:#2563a7;color:#2563a7}dl{display:grid;grid-template-columns:180px 1fr;gap:9px}dt{color:#526170}dd{margin:0}pre{white-space:pre-wrap;background:#f3f6f9;padding:14px}small{color:#526170}.notice{border-left:4px solid #2563a7;padding-left:12px}#log{max-height:190px;overflow:auto}</style>
<h1>Goal 等待策略与调度所有权</h1><p class="notice">问题：如何让用户选择不同等待策略，却不把“保存配置”误当成“立即换 driver”？这是<strong>建议控制模型，不是已经实现的配置页面</strong>。纯内存、不连接 DSH、不模拟全部原生协议；32 个真实模块场景在单独的实验文件中。</p>
<section><h2>当前状态</h2><dl id="state"></dl><p id="decision"></p></section>
<section><h2>自由操作</h2><label>下次启动想使用的策略 <select id="mode"></select></label><div id="actions"></div><small>“受控新启动”演示目标默认 disarmed 的合同；不表示当前插件已有安全热切换、配置存储或重启功能。Off 仅关闭自动 goal 续轮，不关闭人工输入或回报。</small></section>
<section><h2>引导场景</h2><nav id="tabs"></nav><p id="story"></p><div id="steps"></div></section>
<section><h2>变化记录</h2><pre id="log"></pre><details><summary>完整模型状态</summary><pre id="json"></pre></details></section>
<script>
// Pure, deliberately simplified reducer. This is NOT the DSH driver, admission fence, or a settings backend.
const names={activation:'Activation 闸门（当前默认）','running-wait':'收尾等待（研究）','driver-replacement':'后台感知替代 driver（研究）',native:'原生行为',off:'无自动续轮'};
const initial=mode=>({effective:mode,requested:mode,owner:mode==='off'?'none':mode==='driver-replacement'?'replacement':'native',ownerCount:mode==='off'?0:1,parent:'running',openTurn:true,goalPhase:'active',activation:'armed',jobs:0,awaitingNotices:0,rounds:0,calls:1,reason:'人类任务 turn 尚未收尾'});
function assess(s){const n={...s};if(n.ownerCount>1){n.reason='错误组成：独立 driver 不共享 reservation；拒绝作为安全状态';return n;}if(n.owner==='none'){n.reason='没有自动 goal scheduler；仍可处理人工输入';return n;}if(n.goalPhase!=='active'||n.activation!=='armed'){n.reason='目标没有继续授权';return n;}if(n.parent!=='idle'){n.reason='父 turn 尚未结束';return n;}if(n.effective==='driver-replacement'&&(n.jobs||n.awaitingNotices)){n.reason='后台工作或待送达回报阻止新 reservation；goal 仍 armed';return n;}n.rounds++;n.calls++;n.reason='模型示意：准入一个新 goal round（不是后台 notice 的权限）';return n;}
function reduce(state,action){let s={...state};switch(action.type){case 'stage':s.requested=action.mode;s.reason='仅保存下次启动选择；当前 driver 不变';break;case 'job':s.jobs++;s.reason='后台工作启动';break;case 'stop':if(s.effective==='running-wait'&&s.jobs){s.reason='收尾等待保持 running/open turn';break;}s.parent='idle';s.openTurn=false;if(s.effective==='activation'&&s.jobs){s.activation='disarmed';s.reason='当前策略撤销临时续轮授权';}else s=assess(s);break;case 'settle':s.jobs=Math.max(0,s.jobs-1);s.reason='后台结算；演示假设其普通回报已处理';if(s.effective==='running-wait'&&!s.jobs){s.parent='idle';s.openTurn=false;}if(s.effective==='activation'&&!s.jobs)s.activation='armed';s=assess(s);break;case 'pending':s.awaitingNotices++;s.reason='子任务虽已脱离 registry，仍等待其原生回报';break;case 'notice':s.awaitingNotices=Math.max(0,s.awaitingNotices-1);s.calls++;s.reason='处理真实子任务回报（不等同自动 goal 权限）';s=assess(s);break;case 'restart':s.effective=s.requested;s.owner=s.effective==='off'?'none':s.effective==='driver-replacement'?'replacement':'native';s.ownerCount=s.owner==='none'?0:1;s.parent='idle';s.openTurn=false;s.jobs=0;s.awaitingNotices=0;s.activation='disarmed';s.reason='受控新启动：唯一 owner；未移交旧 reservation；等待人类恢复目标';break;case 'resume':s.activation='armed';s=assess(s);break;case 'duplicate':s.ownerCount++;s=assess(s);break;case 'evaluate':s=assess(s);break;case 'human':s.calls++;s.reason='正常人工输入可被处理；不假冒自动 goal source';break;}return s;}
</script>
<script>
let current=initial('activation'),history=[],stepIndex=0,selected=0;
const actions=[['job','启动后台工作'],['stop','父任务收尾'],['settle','结算一个后台工作'],['pending','记录待送达子任务回报'],['notice','送达并处理子任务回报'],['human','新的人类输入'],['evaluate','重新评估调度'],['restart','受控新启动（示意）'],['resume','人类明确恢复目标'],['duplicate','错误：并挂第二个 driver']];
const scenarios=[{title:'真正 idle 的等待',mode:'driver-replacement',text:'后台运行时，父任务可以真正结束 turn；goal 保留 armed，但新 round 不被预留。',steps:[['job'],['stop'],['evaluate'],['human'],['settle']]},{title:'保存不是在线切换',mode:'activation',text:'先进入现行 activation 等待；只修改下次启动的选择，不改变当前 owner。新启动后依旧需要人类恢复。',steps:[['job'],['stop'],['stage','driver-replacement'],['restart'],['resume']]},{title:'registry 空不等于回报到了',mode:'driver-replacement',text:'这是“欠通知”概念示意，不证明已 announced 或 epoch 正确；原生实验仅验证了选定的延迟送达场景。',steps:[['pending'],['stop'],['evaluate'],['notice']]},{title:'错误的双 driver',mode:'driver-replacement',text:'两个独立 scheduler 不能共同使用一份 reservation。原生负对照观察到 prompt 被拒绝和 goal blocked。',steps:[['duplicate'],['stop'],['evaluate']]}];
const byId=id=>document.getElementById(id);
function label(type,mode){return type==='stage'?'选择下次启动：'+names[mode]:actions.find(x=>x[0]===type)?.[1];}
function dispatch(type,mode){current=reduce(current,{type,mode});history.push(label(type,mode)+' → '+current.reason);render();}
function start(i){selected=i;stepIndex=0;current=initial(scenarios[i].mode);history=['开始：'+scenarios[i].title];render();}
function render(){const fields=[['当前生效策略',names[current.effective]],['下次启动选择',names[current.requested]],['调度 owner',current.owner+' / 数量 '+current.ownerCount],['父执行状态',current.parent+' / physical turn '+(current.openTurn?'open':'closed')],['目标 phase / activation',current.goalPhase+' / '+current.activation],['存活后台工作',current.jobs],['待送达子任务回报',current.awaitingNotices],['已准入 goal rounds（示意）',current.rounds],['模型调用（示意）',current.calls]];byId('state').replaceChildren(...fields.flatMap(([k,v])=>{const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=k;dd.textContent=String(v);return[dt,dd];}));byId('decision').textContent=current.reason;byId('mode').value=current.requested;byId('json').textContent=JSON.stringify(current,null,2);byId('log').textContent=history.join(String.fromCharCode(10));byId('story').textContent=scenarios[selected].text;byId('tabs').replaceChildren(...scenarios.map((item,i)=>{const b=document.createElement('button');b.textContent=item.title;b.setAttribute('aria-selected',String(i===selected));b.onclick=()=>start(i);return b;}));byId('steps').replaceChildren(...scenarios[selected].steps.map(([type,mode],i)=>{const b=document.createElement('button');b.textContent=(i+1)+'. '+label(type,mode);b.disabled=i!==stepIndex;b.onclick=()=>{stepIndex++;dispatch(type,mode);};return b;}));}
byId('mode').replaceChildren(...Object.entries(names).map(([key,value])=>{const o=document.createElement('option');o.value=key;o.textContent=value;return o;}));byId('mode').onchange=e=>dispatch('stage',e.target.value);for(const[type,title]of actions){const b=document.createElement('button');b.textContent=title;b.onclick=()=>dispatch(type);byId('actions').append(b);}start(0);
</script></html>
